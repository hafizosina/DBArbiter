# Runs on GitHub every time you push:
#   - a push to main:          run the tests, build the Linux and Windows downloads
#   - a push of a version tag: the same, then publish them as a GitHub Release
#     (git push origin v0.1.16)
name: build

on:
  push:
    branches: [main]
    tags: ['v*']

# allows the last step to create a Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pick the version number
        # a tag v0.1.16 gives 0.1.16; a normal push uses <revision> from pom.xml
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' pom.xml)" >> "$GITHUB_ENV"
          fi

      - name: Run the tests
        # xvfb-run gives the UI tests a virtual screen
        run: xvfb-run -a mvn -B test

      - name: Build the Linux download
        # -DskipTests: the tests already ran above
        run: packaging/build-linux.sh -DskipTests -Drevision=$VERSION -Dbuild.commit=$GITHUB_SHA

      - name: Build the Windows download
        run: packaging/build-windows.sh -Drevision=$VERSION -Dbuild.commit=$GITHUB_SHA

      - name: Keep the downloads on the run page for 7 days
        uses: actions/upload-artifact@v6
        with:
          name: DBArbiter-${{ env.VERSION }}
          path: |
            target/linux/DBArbiter-linux-x64.tar.gz
            target/windows/DBArbiter-windows-x64.zip
          retention-days: 7

      - name: Publish the Release (version tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/linux/DBArbiter-linux-x64.tar.gz \
            target/windows/DBArbiter-windows-x64.zip \
            --title "DBArbiter $VERSION" \
            --generate-notes
