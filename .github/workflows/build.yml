# Publishes a GitHub Release with the Linux and Windows downloads.
# Runs only when you push a version tag:
#   git push origin v0.1.17
name: release

on:
  push:
    tags: ['v*']

# allows the last step to create the Release
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pick the version number
        # the tag v0.1.17 gives 0.1.17
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Run the tests
        # xvfb-run gives the UI tests a virtual screen
        run: xvfb-run -a mvn -B test

      - name: Build the Linux download
        # -DskipTests: the tests already ran above
        run: packaging/build-linux.sh -DskipTests -Drevision=$VERSION -Dbuild.commit=$GITHUB_SHA

      - name: Build the Windows download
        run: packaging/build-windows.sh -Drevision=$VERSION -Dbuild.commit=$GITHUB_SHA

      - name: Check both downloads contain JavaFX
        # stops here (no Release) if a download would not start
        run: |
          unzip -l target/dbarbiter.jar | grep javafx/application/Application.class
          unzip -l target/dbarbiter-win.jar | grep javafx/application/Application.class

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/linux/DBArbiter-linux-x64.tar.gz \
            target/windows/DBArbiter-windows-x64.zip \
            --title "DBArbiter $VERSION" \
            --generate-notes
